chapter: 4
topic: cannabis
mode: learn
title: Ketamine
answer:
  text: SPRAVATO (esketamine nasal spray) is FDA-approved for certain depression treatments, with strict safety rules.
  claims: [c10, c11]
  block: plain
  id: s1
sentences:
- text: SPRAVATO is FDA-approved for treatment-resistant depression in adults, alone or with an oral antidepressant, and for depressive symptoms in major depression with acute suicidal thoughts or behavior.
  claims: [c10]
  block: plain
  id: s2
- text: Because of sedation, dissociation and breathing-slowing risks, patients must be monitored for at least 2 hours after each dose, and the drug is only available through a restricted safety program (REMS).
  claims: [c11]
  block: plain
  id: s3
- text: Its effectiveness in preventing suicide or reducing suicidal thoughts or behavior has not been demonstrated.
  claims: [c12]
  block: plain
  id: s4
errata: []

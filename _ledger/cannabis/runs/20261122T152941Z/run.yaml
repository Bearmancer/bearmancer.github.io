prompt: 'Rewrite the existing /cannabis article as a current, plain-language, evidence-led
  consumer explainer. Preserve all eight substance sections: Cannabis, Psilocybin,
  MDMA, Ketamine, LSD, Ibogaine, DMT/ayahuasca, and Mescaline. Keep the article concise,
  with at most three reader-facing claims per substance and no more than 24 claims
  total.


  Fetch and cite source text only through direct HTTP GET. Use only these seven URLs,
  mapped to the named sections:

  - Cannabis: https://pmc.ncbi.nlm.nih.gov/articles/PMC11459363/

  - Psilocybin: https://pmc.ncbi.nlm.nih.gov/articles/PMC8864328/

  - MDMA: https://download.open.fda.gov/crl/CRL_NDA215455_20240808.pdf

  - Ketamine: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/211243s016lbl.pdf

  - LSD: https://pmc.ncbi.nlm.nih.gov/articles/PMC12030196/

  - Ibogaine: https://pmc.ncbi.nlm.nih.gov/articles/PMC9292417/

  - DMT/ayahuasca: https://pmc.ncbi.nlm.nih.gov/articles/PMC6182612/


  Do not use staged text as a substitute for direct retrieval. Do not use Tavily,
  Firecrawl, another provider, or any alternate URL. If a direct request is blocked
  or produces unusable text, leave that section''s relevant evidence gap explicit
  and make no unsupported claim. Mescaline is unassessed: the only attempted PubMed
  source returned a bot challenge, and it must not be used. Distinguish FDA-approved
  products/indications from investigational use; describe human trial results and
  their limits without implying efficacy beyond the source. Include citations for
  factual claims and preserve uncertainty. Do not publish or modify main.'

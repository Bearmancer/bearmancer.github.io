body:
  sections:
  - heading: Legal status
    sentences:
    - id: s2
      text: LSD remains a Schedule I substance, and that classification continues to hinder large-scale
        clinical trials and broader medical acceptance.
      claims:
      - c13
      block: plain
  - heading: Trial results
    sentences:
    - id: s3
      text: In a Phase IIb trial with 198 participants, a single 100 microgram dose produced symptom remission
        in 50% of those with generalized anxiety disorder.
      claims:
      - c14
      block: plain
  - heading: Safety concerns
    sentences:
    - id: s4
      text: Reported safety concerns include cardiovascular risks, emotional vulnerability, and the potential
        for hallucinogen-persisting perception disorder (HPPD).
      claims:
      - c15
      block: plain

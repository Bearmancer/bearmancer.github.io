schema: 1
title: MDMA
topic: cannabis
mode: learn
subject: Health
chapter: 3
layout: concept
answer:
  id: s1
  text: The FDA found the MDMA therapy application's safety data unreliable and its lasting benefit unproven.
  claims:
  - c7
  - c8
  block: plain
body:
  sections:
  - heading: Why the FDA objected
    sentences:
    - id: s2
      text: The FDA found the application's safety data unreliable because the sponsor's training taught
        study sites not to report 'positive' or 'favorable' effects as adverse events.
      claims:
      - c7
      block: plain
    - id: s3
      text: The agency also concluded the application did not show the treatment effect lasted beyond
        the 18-week end-of-study assessments.
      claims:
      - c8
      block: plain
  - heading: What happens next
    sentences:
    - id: s4
      text: The FDA recommended a new clinical trial to assess how long any benefit lasts and to properly
        characterize safety before approval.
      claims:
      - c9
      block: plain
errata: []
